<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chattbot</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar para seleção de personagens -->
        <div id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>Meus Bots</h2>
                <button id="close-sidebar-btn">❌</button>
            </div>
            <ul id="character-list">
                <!-- Lista de bots entrará aqui -->
            </ul>
            <button id="new-character-btn" class="primary-btn">+ Novo Bot</button>
        </div>

        <!-- Header -->
        <header>
            <button id="menu-btn" title="Lista de Personagens">☰</button>
            <div class="avatar" id="header-avatar">🤖</div>
            <h1 id="bot-name-display">Meu Bot</h1>
            <button id="settings-btn" title="Configurar Personagem Atual">⚙️</button>
        </header>

        <!-- Chat Area -->
        <main id="chat-container">
            <div class="messages" id="messages">
                <!-- Mensagens entrarão aqui -->
            </div>
        </main>

        <!-- Input Area -->
        <footer>
            <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </footer>

        <!-- Settings Modal (Criar/Editar Personagem) -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Configurar Personagem</h2>
                <label>Nome do Bot:</label>
                <input type="text" id="bot-name" placeholder="Ex: Ana">
                
                <label>Descrição/Personalidade (Prompt):</label>
                <textarea id="bot-personality" rows="5" placeholder="Descreva como o bot deve agir..."></textarea>
                
                <div class="modal-actions">
                    <button id="delete-bot-btn" class="danger-btn">Apagar</button>
                    <button id="save-settings-btn" class="primary-btn">Salvar</button>
                    <button id="close-settings-btn" class="secondary-btn">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => {
                console.log('Service Worker Registrado');
            }).catch((error) => {
                console.log('Service Worker não registrado:', error);
            });
        }
    </script>
</body>
</html>
