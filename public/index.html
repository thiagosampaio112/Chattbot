<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chattbot</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>Meus Bots</h2>
                <button id="close-sidebar-btn">❌</button>
            </div>
            <ul id="character-list"></ul>
            <button id="new-character-btn" class="primary-btn">+ Novo Bot</button>
        </div>

        <!-- Header -->
        <header>
            <button id="menu-btn" title="Lista de Personagens">☰</button>
            <div class="avatar" id="header-avatar" style="background-size: cover; background-position: center;">🤖</div>
            <h1 id="bot-name-display">Meu Bot</h1>
            <button id="settings-btn" title="Configurar Personagem Atual">⚙️</button>
        </header>

        <!-- Chat Area -->
        <main id="chat-container">
            <div class="messages" id="messages"></div>
        </main>

        <!-- Input Area -->
        <footer>
            <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </footer>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content settings-scroll">
                <h2 id="modal-title">Configurar Personagem</h2>
                
                <label>Nome do Bot:</label>
                <input type="text" id="bot-name" placeholder="Ex: Ana">
                
                <label>Descrição/Personalidade (Prompt):</label>
                <textarea id="bot-personality" rows="3" placeholder="Descreva como o bot deve agir..."></textarea>
                
                <label>Personagens Secundários / Mundo (Opcional):</label>
                <textarea id="bot-scenario" rows="3" placeholder="Ex: 'Ana é a melhor amiga dela, muito sarcástica e sempre interrompe as conversas.' A IA dará voz a eles."></textarea>
                
                <button id="clear-chat-btn" class="secondary-btn" style="width: 100%; margin-top: 5px; background-color: #444;">🧹 Limpar Histórico de Conversa</button>
                
                <hr class="divider">

                <h3>Visual</h3>
                <div class="visual-settings">
                    <div>
                        <label>Foto de Perfil (Avatar):</label>
                        <input type="file" id="bot-avatar-file" accept="image/*">
                        <div id="avatar-preview" class="preview-box">Nenhuma foto</div>
                    </div>
                    <div>
                        <label>Papel de Parede do Chat:</label>
                        <input type="file" id="bot-bg-file" accept="image/*">
                        <div id="bg-preview" class="preview-box">Nenhum fundo</div>
                    </div>
                </div>

                <hr class="divider">
                
                <h3>Imagens e Contextos</h3>
                <p class="help-text">Adicione fotos e crie tags (ex: <i>feliz, brava, apaixonada</i>) para a IA usar durante a conversa.</p>
                
                <div id="image-upload-section">
                    <input type="text" id="new-tag-name" placeholder="Tags separadas por vírgula (ex: feliz, sorrindo)">
                    <input type="file" id="new-tag-file" accept="image/*">
                    <button id="add-tag-btn" class="secondary-btn">Adicionar Imagem</button>
                </div>
                
                <ul id="tags-list"></ul>

                <hr class="divider">
                
                <div class="modal-actions">
                    <button id="delete-bot-btn" class="danger-btn">Apagar</button>
                    <button id="duplicate-bot-btn" class="secondary-btn" style="background-color: #007bff;">Duplicar</button>
                    <button id="save-settings-btn" class="primary-btn">Salvar</button>
                    <button id="close-settings-btn" class="secondary-btn">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
